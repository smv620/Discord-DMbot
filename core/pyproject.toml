[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dmbot"
version = "0.1.0"
description = "DMbot core: Discord slash commands, consent, transcription and DM assistance."
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7,<3",  # 2.7: file uploads in forms (#264)
    "aiohttp>=3.14",  # dmbot.fetch opens any link: stay on the version tested (#264)
    "yarl>=1.9",  # imported directly by dmbot.fetch
    "websockets>=13,<17",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",  # the admin password's hash (#772)
    "psycopg-pool>=3.2",
    "pypdf>=6.1",  # reading a PDF's text for a names list (6.x limits decompression)
    # The website's API (python -m dmbot.web, #435): its own container, same image.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Reading a DM's Discord voice message (Ogg Opus) into audio (#935). Its wheels carry
    # their own codecs; nothing else is installed on the server for it.
    "av>=12",
]

[project.optional-dependencies]
# Local transcription (TRANSCRIBER=whisper-local). Not needed for TRANSCRIBER=cloud.
whisper = [
    "faster-whisper>=1.1",
    "numpy>=1.26",
]
# The session twin (python -m dmbot.devtools.replay, #299) reading m4a/mp3 recordings:
# PyAV is a normal dependency now (the DM sidebar reads voice messages), so this adds nothing.
twin = []
# Rebuilding the SRD data files (python -m dmbot.devtools.srd, #1892): pypdfium2 reads the PDF's
# text in full; pypdf and pdfminer.six leave parts of it out. Never needed to run the bot.
srd = ["pypdfium2>=4.30"]
dev = [
    "numpy>=1.26",
    "pytest>=8",
    "pytest-xdist>=3.5",  # CI runs the tests on every core (#1323); each test has its own schema
    "pytest-cov>=5",  # coverage, reported in CI but not enforced (#1858)
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",  # testing the web API in-process
    "import-linter>=2.0",  # feature boundaries, checked in CI (#2130)
]

[project.scripts]
dmbot = "dmbot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The plan facts (#432, #437): a copy of web/src/content/plans.json; a test keeps them equal.
# The rules data (#866): the SRD 5.2.1's spells and conditions, and its attribution.
dmbot = ["plans.json", "rules/data/srd52/*.json", "rules/data/srd52/*.md", "rules/data/srd51/*.json", "rules/data/srd51/*.md", "sidebar/*.md", "recaps/style_examples/*.txt", "devtools/golden/story/*.txt", "devtools/golden/recap/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
# User-facing Discord text intentionally uses typographic characters (×, ›, —).
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["dotenv", "faster_whisper", "av", "pypdfium2", "pypdfium2.raw"]
ignore_missing_imports = true

# Feature boundaries (#2130, docs/PLAN.md "A worker container, and a smaller bot.py"). Run
# `lint-imports` in core/. Each ignored import below is an exception that exists today; every one
# cites #2827, which removes them, so the list only shrinks. A new forbidden import fails CI.
[tool.importlinter]
root_package = "dmbot"

[[tool.importlinter.contracts]]
name = "Features never import bot.py"
type = "forbidden"
source_modules = [
    "dmbot.recaps", "dmbot.memory", "dmbot.rules", "dmbot.sidebar", "dmbot.transcript",
    "dmbot.web", "dmbot.campaigns", "dmbot.names", "dmbot.timebot", "dmbot.dm_screen",
    "dmbot.audio", "dmbot.transcription",
]
forbidden_modules = ["dmbot.bot"]
allow_indirect_imports = true
ignore_imports = [
    "dmbot.recaps.discord -> dmbot.bot",  # type-only (#2827)
]

[[tool.importlinter.contracts]]
name = "Domain packages never import the Discord screens (ui)"
type = "forbidden"
source_modules = [
    "dmbot.memory", "dmbot.rules", "dmbot.transcript", "dmbot.campaigns", "dmbot.names",
    "dmbot.timebot", "dmbot.sidebar", "dmbot.audio", "dmbot.transcription", "dmbot.web",
]
forbidden_modules = ["dmbot.ui"]
allow_indirect_imports = true
ignore_imports = [  # all #2827
    "dmbot.sidebar.answer -> dmbot.ui.rule_card",
    "dmbot.sidebar.looked -> dmbot.ui.logic",
    "dmbot.sidebar.looked -> dmbot.ui.rule_card",
    "dmbot.sidebar.looked -> dmbot.ui.rule_lookup",
    "dmbot.sidebar.service -> dmbot.ui.looked_at",
    "dmbot.sidebar.service -> dmbot.ui.rule_clash",
]

[[tool.importlinter.contracts]]
name = "Lower packages never import recaps or web"
type = "forbidden"
source_modules = [
    "dmbot.memory", "dmbot.rules", "dmbot.transcript", "dmbot.campaigns", "dmbot.names",
    "dmbot.timebot", "dmbot.audio", "dmbot.transcription",
]
forbidden_modules = ["dmbot.recaps", "dmbot.web"]
allow_indirect_imports = true
ignore_imports = [  # all #2827
    "dmbot.memory.plot_talk -> dmbot.recaps.feedback",
    "dmbot.transcript.respell -> dmbot.recaps.store",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
