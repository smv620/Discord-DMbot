[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dmbot"
version = "0.1.0"
description = "DMbot core: Discord slash commands, consent, transcription and DM assistance."
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7,<3",  # 2.7: file uploads in forms (#264)
    "aiohttp>=3.14",  # dmbot.fetch opens any link: stay on the version tested (#264)
    "yarl>=1.9",  # imported directly by dmbot.fetch
    "websockets>=13,<17",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pypdf>=6.1",  # reading a PDF's text for a names list (6.x limits decompression)
    # The website's API (python -m dmbot.web, #435): its own container, same image.
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Local transcription (TRANSCRIBER=whisper-local). Not needed for TRANSCRIBER=cloud.
whisper = [
    "faster-whisper>=1.1",
    "numpy>=1.26",
]
# The session twin (python -m dmbot.devtools.replay, #299) reading m4a/mp3 recordings.
twin = [
    "av>=12",
]
dev = [
    "numpy>=1.26",
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",  # testing the web API in-process
]

[project.scripts]
dmbot = "dmbot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The plan facts (#432, #437): a copy of web/src/content/plans.json; a test keeps them equal.
dmbot = ["plans.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
# User-facing Discord text intentionally uses typographic characters (×, ›, —).
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["dotenv", "faster_whisper", "av"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
