# Runs DMbot on a server: `docker compose up -d --build`
# Settings come from .env in this folder (copy .env.example). No port is published:
# ears talks to core over a private Docker network, and the only way in from the internet
# is the optional Cloudflare Tunnel (cloudflared, web profile), which carries the admin
# paths only.
services:
  postgres:
    image: postgres:16
    environment:
      # The admin (superuser) password is only used inside this container. DMbot itself
      # connects as the ordinary "dmbot" role created by deploy/postgres-init.
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      DMBOT_DB_PASSWORD: ${DMBOT_DB_PASSWORD:?set DMBOT_DB_PASSWORD in .env}
      DMBOT_WEB_DB_PASSWORD: ${DMBOT_WEB_DB_PASSWORD:-}   # the website's role (#498), if set
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP, so it only passes once first-time setup has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dmbot -d dmbot"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  core:
    image: dmbot-core   # shared with web-api
    build:
      context: ./core
      args:
        EXTRAS: ${CORE_EXTRAS:-whisper}   # set CORE_EXTRAS=dev for cloud transcription only
        GIT_COMMIT: ${GIT_COMMIT:-}       # baked in: DMbot links to its documents at this commit
    env_file: .env
    environment:
      EARS_WS_HOST: 0.0.0.0   # listen on the private network so ears can reach it
      DMBOT_DOCS_DIR: /app/knowledge   # its own documents, mounted below (#1195)
      LOG_FORMAT: ${LOG_FORMAT:-json}   # one JSON line per event on servers
      DATABASE_URL: postgresql://dmbot:${DMBOT_DB_PASSWORD}@postgres:5432/dmbot
      POSTGRES_ADMIN_PASSWORD: ""   # only the postgres service needs these
      DMBOT_DB_PASSWORD: ""
      DISCORD_CLIENT_SECRET: ""     # the website API's secrets stay in web-api
      WEB_SECRET_KEY: ""
      PAYMENT_WEBHOOK_SECRET: ""
      DMBOT_WEB_DB_PASSWORD: ""
      CLOUDFLARE_TUNNEL_TOKEN: ""   # only the tunnel container holds it (#836)
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - dmbot-data:/data       # local files (campaign data itself is in Postgres)
      # The recaps' narration and music (#1383). Its own volume so the website's API can read it
      # (read-only, below) without seeing anything else in /data. Mounted over /data/recap-audio.
      - recap-audio:/data/recap-audio
      - whisper-models:/models # downloaded Whisper models, kept across updates
      - test-recordings:/var/lib/dmbot/test-recordings   # saved test sessions (#1019), test server only
      # Read at start-up to warn when .env is missing newer settings (#31). Names only.
      - ./.env.example:/app/.env.example:ro
      # What DMbot answers questions about itself from (#1195): the checkout it was built from.
      # Mounted, not copied into the image: the image is built from ./core alone, and moving the
      # build to the repository root would change CI's image build too. Deploys always rebuild
      # (docs/DEPLOY.md), so the files and the code come from the same checkout.
      - ./docs/PLAN.md:/app/knowledge/docs/PLAN.md:ro
      - ./README.md:/app/knowledge/README.md:ro
      - ./web/src/content/help.ts:/app/knowledge/web/src/content/help.ts:ro
    restart: unless-stopped

  ears:
    build: ./ears
    env_file: .env
    environment:
      EARS_WS_HOST: core       # reach core by its service name
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_URL: ""         # ears never touches the database
      POSTGRES_ADMIN_PASSWORD: ""
      DMBOT_DB_PASSWORD: ""
      CLOUD_STT_API_KEY: ""    # speech-to-text keys are core's (and the bake-off's) only
      SPEECHMATICS_API_KEY: ""
      DEEPGRAM_API_KEY: ""
      DISCORD_CLIENT_SECRET: ""     # the website API's secrets stay in web-api
      WEB_SECRET_KEY: ""
      PAYMENT_WEBHOOK_SECRET: ""
      DMBOT_WEB_DB_PASSWORD: ""
      CLOUDFLARE_TUNNEL_TOKEN: ""   # only the tunnel container holds it (#836)
    depends_on:
      - core
    restart: unless-stopped

  # The website's API (#435): Discord sign-in, the account page, payments. Same image as
  # core, its own process. Off until the Website API settings are in .env: start it with
  # COMPOSE_PROFILES=web in .env (or `docker compose --profile web up -d`). Listens only on
  # the private network; the cloudflared service below publishes it (admin paths only).
  web-api:
    profiles: ["web"]
    image: dmbot-core   # the same image as core: built once
    build:
      context: ./core
      args:
        EXTRAS: ${CORE_EXTRAS:-whisper}
        GIT_COMMIT: ${GIT_COMMIT:-}   # (the same image as core: both builds must agree)
    command: ["python", "-m", "dmbot.web"]
    # Only the settings the API needs, listed by name (no env_file): a secret added to
    # .env later never reaches it by accident. No bot token, voice secret, AI or speech keys.
    environment:
      # Its own role, held by the database to the signed-in person's servers (#498).
      DATABASE_URL: postgresql://dmbot_web:${DMBOT_WEB_DB_PASSWORD:-}@postgres:5432/dmbot
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      WEB_SECRET_KEY: ${WEB_SECRET_KEY:-}
      WEB_SITE_URL: ${WEB_SITE_URL:-}
      WEB_API_URL: ${WEB_API_URL:-}
      WEB_API_PORT: ${WEB_API_PORT:-8080}
      WEB_SESSION_DAYS: ${WEB_SESSION_DAYS:-30}
      # Which speech-to-text the bot uses, so the approval check counts only the consent that
      # holds for it (the same setting as the bot's; no key).
      TRANSCRIBER: ${TRANSCRIBER:-whisper-local}
      # Whether the bot has a voice for recap narration, so the recap page greys its audio button
      # when it does not (#2419). `:+1` passes "1" when the setting exists and never the value:
      # the speech key stays out of this container.
      RECAP_AUDIO_KEY_SET: ${ELEVENLABS_API_KEY:+1}
      RECAP_AUDIO_VOICE_SET: ${ELEVENLABS_VOICE_ID:+1}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      # Stripe (#1110): used when PAYMENT_PROVIDER=stripe. The webhook secret above is its
      # endpoint's signing secret.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_TABLE: ${STRIPE_PRICE_TABLE:-}
      STRIPE_PRICE_TWO_TABLES: ${STRIPE_PRICE_TWO_TABLES:-}
      STRIPE_PRICE_GUILD: ${STRIPE_PRICE_GUILD:-}
      STRIPE_PRICE_EXTRA_HOURS: ${STRIPE_PRICE_EXTRA_HOURS:-}
      STRIPE_PRICE_RECAP_AUDIO: ${STRIPE_PRICE_RECAP_AUDIO:-}
      STRIPE_MANAGED_PAYMENTS: ${STRIPE_MANAGED_PAYMENTS:-}
      # The monthly recap allowances (#1428), so the page can say "N of M this month".
      DMBOT_RECAPS_PER_MONTH: ${DMBOT_RECAPS_PER_MONTH:-}
      DMBOT_RECAP_AUDIO_PER_MONTH: ${DMBOT_RECAP_AUDIO_PER_MONTH:-}
      # The "Say hello" forms (#665).
      GITHUB_FEEDBACK_TOKEN: ${GITHUB_FEEDBACK_TOKEN:-}
      LINK_TOKEN_SECRET: ${LINK_TOKEN_SECRET:-}
      # Account emails, such as sign-in links (#1231): nothing is sent while SMTP_HOST is empty.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # The support flow (#1431): who writes to people, who alerts the team, the AI that answers,
      # and the secret that proves an emailed reply came from the mail service.
      MAIL_SUPPORT_FROM: ${MAIL_SUPPORT_FROM:-}
      MAIL_ALERTS_FROM: ${MAIL_ALERTS_FROM:-}
      OWNER_ALERT_EMAIL: ${OWNER_ALERT_EMAIL:-}
      MAIL_ALERTS_REPLY_TO: ${MAIL_ALERTS_REPLY_TO:-}
      MAIL_INBOUND_SECRET: ${MAIL_INBOUND_SECRET:-}
      MAIL_REPLY_DOMAIN: ${MAIL_REPLY_DOMAIN:-}
      SUPPORT_AI_MODEL: ${SUPPORT_AI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MAIL_POSTAL_ADDRESS: ${MAIL_POSTAL_ADDRESS:-}
      MAIL_DAILY_CAP: ${MAIL_DAILY_CAP:-400}
      GITHUB_FEEDBACK_REPO: ${GITHUB_FEEDBACK_REPO:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      SUPPORT_TEAM_EMAIL: ${SUPPORT_TEAM_EMAIL:-}
      WEB_CLIENT_IP_HEADER: ${WEB_CLIENT_IP_HEADER:-}
      # The admin page's sign-in (#772).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Free access (#771): the owner's own Discord ids, as the bot reads them.
      DMBOT_FREE_USERS: ${DMBOT_FREE_USERS:-}
      # The same switch as the bot's: the site's hand-over accept checks the campaign cap too.
      DMBOT_ENFORCE_PLANS: ${DMBOT_ENFORCE_PLANS:-0}
      # Importing older sessions (#2105): off until dev1 has checked a real import.
      DMBOT_IMPORTS: ${DMBOT_IMPORTS:-0}
      # Servers where importing is on although the line above is off (#2259): test servers only.
      DMBOT_IMPORTS_SERVERS: ${DMBOT_IMPORTS_SERVERS:-}
      # The same switch as the bot's: with recaps off, "make the narration again" is refused (#2183).
      DMBOT_RECAPS: ${DMBOT_RECAPS:-0}
      # The same switch as the bot's (#2532): off, the email hand-over routes answer 404.
      DMBOT_HANDOVER_EMAIL: ${DMBOT_HANDOVER_EMAIL:-0}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Where it finds the recap audio (#1418): the volume below, read-only. A path inside the
      # container, so not an .env setting.
      WEB_RECAP_AUDIO_DIR: /recap-audio
    volumes:
      - recap-audio:/recap-audio:ro
    expose:
      - "${WEB_API_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('WEB_API_PORT', '8080') + '/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_started   # core updates the database and grants dmbot_web
    restart: unless-stopped

  # The way in to web-api from the internet (#836): a Cloudflare Tunnel. cloudflared only
  # makes an outbound connection to Cloudflare, so the server opens no inbound port and
  # Cloudflare keeps the certificate. It is the only way in from outside to web-api, which
  # is why WEB_CLIENT_IP_HEADER=CF-Connecting-IP can be trusted. (core and ears share the
  # private network and are our own code, so they could reach web-api; nothing outside can.)
  # Which paths go through is set in Cloudflare (the public hostname's path), not here: see
  # "Put the admin API online" in docs/DEPLOY.md. Stop it with `docker compose stop
  # cloudflared` to close the way in.
  cloudflared:
    profiles: ["web"]
    image: cloudflare/cloudflared:2026.10.0   # pinned: no surprise upgrades; bump on purpose
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}   # from Cloudflare; set with scripts/set-key
    depends_on:
      - web-api
    restart: unless-stopped

volumes:
  postgres-data:
  dmbot-data:
  recap-audio:   # the bot writes it; the website API reads it (#1418)
  whisper-models:
  test-recordings:
