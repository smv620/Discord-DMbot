# Runs DMbot on a server: `docker compose up -d --build`
# Settings come from .env in this folder (copy .env.example). No port is published:
# ears talks to core over a private Docker network, and the only way in from the internet
# is the optional Cloudflare Tunnel (cloudflared, web profile), which carries the admin
# paths only.
services:
  postgres:
    image: postgres:16
    environment:
      # The admin (superuser) password is only used inside this container. DMbot itself
      # connects as the ordinary "dmbot" role created by deploy/postgres-init.
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      DMBOT_DB_PASSWORD: ${DMBOT_DB_PASSWORD:?set DMBOT_DB_PASSWORD in .env}
      DMBOT_WEB_DB_PASSWORD: ${DMBOT_WEB_DB_PASSWORD:-}   # the website's role (#498), if set
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP, so it only passes once first-time setup has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dmbot -d dmbot"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  core:
    image: dmbot-core   # shared with web-api
    build:
      context: ./core
      args:
        EXTRAS: ${CORE_EXTRAS:-whisper}   # set CORE_EXTRAS=dev for cloud transcription only
    env_file: .env
    environment:
      EARS_WS_HOST: 0.0.0.0   # listen on the private network so ears can reach it
      LOG_FORMAT: ${LOG_FORMAT:-json}   # one JSON line per event on servers
      DATABASE_URL: postgresql://dmbot:${DMBOT_DB_PASSWORD}@postgres:5432/dmbot
      POSTGRES_ADMIN_PASSWORD: ""   # only the postgres service needs these
      DMBOT_DB_PASSWORD: ""
      DISCORD_CLIENT_SECRET: ""     # the website API's secrets stay in web-api
      WEB_SECRET_KEY: ""
      PAYMENT_WEBHOOK_SECRET: ""
      DMBOT_WEB_DB_PASSWORD: ""
      CLOUDFLARE_TUNNEL_TOKEN: ""   # only the tunnel container holds it (#836)
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - dmbot-data:/data       # local files (campaign data itself is in Postgres)
      - whisper-models:/models # downloaded Whisper models, kept across updates
      # Read at start-up to warn when .env is missing newer settings (#31). Names only.
      - ./.env.example:/app/.env.example:ro
    restart: unless-stopped

  ears:
    build: ./ears
    env_file: .env
    environment:
      EARS_WS_HOST: core       # reach core by its service name
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_URL: ""         # ears never touches the database
      POSTGRES_ADMIN_PASSWORD: ""
      DMBOT_DB_PASSWORD: ""
      CLOUD_STT_API_KEY: ""    # speech-to-text keys are core's (and the bake-off's) only
      SPEECHMATICS_API_KEY: ""
      DEEPGRAM_API_KEY: ""
      DISCORD_CLIENT_SECRET: ""     # the website API's secrets stay in web-api
      WEB_SECRET_KEY: ""
      PAYMENT_WEBHOOK_SECRET: ""
      DMBOT_WEB_DB_PASSWORD: ""
      CLOUDFLARE_TUNNEL_TOKEN: ""   # only the tunnel container holds it (#836)
    depends_on:
      - core
    restart: unless-stopped

  # The website's API (#435): Discord sign-in, the account page, payments. Same image as
  # core, its own process. Off until the Website API settings are in .env: start it with
  # COMPOSE_PROFILES=web in .env (or `docker compose --profile web up -d`). Listens only on
  # the private network; the cloudflared service below publishes it (admin paths only).
  web-api:
    profiles: ["web"]
    image: dmbot-core   # the same image as core: built once
    build:
      context: ./core
      args:
        EXTRAS: ${CORE_EXTRAS:-whisper}
    command: ["python", "-m", "dmbot.web"]
    # Only the settings the API needs, listed by name (no env_file): a secret added to
    # .env later never reaches it by accident. No bot token, voice secret, AI or speech keys.
    environment:
      # Its own role, held by the database to the signed-in person's servers (#498).
      DATABASE_URL: postgresql://dmbot_web:${DMBOT_WEB_DB_PASSWORD:-}@postgres:5432/dmbot
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      WEB_SECRET_KEY: ${WEB_SECRET_KEY:-}
      WEB_SITE_URL: ${WEB_SITE_URL:-}
      WEB_API_URL: ${WEB_API_URL:-}
      WEB_API_PORT: ${WEB_API_PORT:-8080}
      WEB_SESSION_DAYS: ${WEB_SESSION_DAYS:-30}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      # The "Say hello" forms (#665).
      GITHUB_FEEDBACK_TOKEN: ${GITHUB_FEEDBACK_TOKEN:-}
      GITHUB_FEEDBACK_REPO: ${GITHUB_FEEDBACK_REPO:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      WEB_CLIENT_IP_HEADER: ${WEB_CLIENT_IP_HEADER:-}
      # The admin page's sign-in (#772).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Free access (#771): the owner's own Discord ids, as the bot reads them.
      DMBOT_FREE_USERS: ${DMBOT_FREE_USERS:-}
      # The same switch as the bot's: the site's hand-over accept checks the campaign cap too.
      DMBOT_ENFORCE_PLANS: ${DMBOT_ENFORCE_PLANS:-0}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "${WEB_API_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('WEB_API_PORT', '8080') + '/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_started   # core updates the database and grants dmbot_web
    restart: unless-stopped

  # The way in to web-api from the internet (#836): a Cloudflare Tunnel. cloudflared only
  # makes an outbound connection to Cloudflare, so the server opens no inbound port and
  # Cloudflare keeps the certificate. It is the only way in from outside to web-api, which
  # is why WEB_CLIENT_IP_HEADER=CF-Connecting-IP can be trusted. (core and ears share the
  # private network and are our own code, so they could reach web-api; nothing outside can.)
  # Which paths go through is set in Cloudflare (the public hostname's path), not here: see
  # "Put the admin API online" in docs/DEPLOY.md. Stop it with `docker compose stop
  # cloudflared` to close the way in.
  cloudflared:
    profiles: ["web"]
    image: cloudflare/cloudflared:2026.10.0   # pinned: no surprise upgrades; bump on purpose
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}   # from Cloudflare; set with scripts/set-key
    depends_on:
      - web-api
    restart: unless-stopped

volumes:
  postgres-data:
  dmbot-data:
  whisper-models:
