name: CI

# Runs on every branch push (results show on the branch's pull request) so fixes can
# be verified before a PR is opened.
on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out which of ears, web and core a push can affect (#1323), so a website-only or
  # docs-only push does not wait for the 20-minute core job. A skipped job shows as "skipped",
  # which GitHub treats as passing. Pushes to development, beta and main run everything, and so
  # does any push this job cannot work out (the jobs below also run if this one fails).
  changes:
    name: changes (which jobs to run)
    permissions:
      contents: read
      actions: read  # asks whether this commit already has a green run (#1984); no other job gets it
    runs-on: ubuntu-22.04  # 24.04 runners were queueing for hours (2026-10-05); see #29
    timeout-minutes: 5
    outputs:
      core: ${{ steps.decide.outputs.core }}
      ears: ${{ steps.decide.outputs.ears }}
      web: ${{ steps.decide.outputs.web }}
      # "true" only when an earlier run of this very commit was green for every job this run needs.
      done: ${{ steps.reuse.outputs.done }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the merge base with origin/development needs the history
      - id: decide
        # A job is skipped only on an explicit "false": empty outputs (a crash here) run everything.
        run: |
          set -o pipefail
          scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
      - id: reuse
        # A commit that already passed (a branch cut from a green commit, a fast-forward of
        # development) is not tested twice (#1984). A new commit has no earlier run, so it always runs.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NEED_CORE: ${{ steps.decide.outputs.core }}
          NEED_EARS: ${{ steps.decide.outputs.ears }}
          NEED_WEB: ${{ steps.decide.outputs.web }}
        run: |
          scripts/ci-already-green.sh | tee -a "$GITHUB_OUTPUT" | tee /tmp/reuse.txt
          if grep -q '^done=true' /tmp/reuse.txt; then
            run=$(sed -n 's/^run=//p' /tmp/reuse.txt)
            echo "::notice title=CI skipped::This commit already passed CI in run ${run}; nothing changed, so nothing is run again."
          elif ! grep -q '^done=false' /tmp/reuse.txt; then
            echo "::warning title=CI skip check::The 'already green?' check gave no answer; everything runs."
          fi

  ears:
    name: ears (Node voice service)
    needs: changes
    if: ${{ always() && needs.changes.outputs.done != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.ears != 'false') }}
    runs-on: ubuntu-22.04  # 24.04 runners were queueing for hours (2026-10-05); see #29
    defaults:
      run:
        working-directory: ears
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ears/package-lock.json
      - name: npm ci
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee install.log || {
            grep -E "npm (error|ERR)" install.log | head -40 | sed 's/^/::error title=npm ci::/'
            exit 1
          }
      - name: typecheck
        run: |
          set -o pipefail
          npx tsc -p tsconfig.json --pretty false 2>&1 | tee tsc.log || {
            sed -nE 's/^([^(]+)\(([0-9]+),([0-9]+)\): error (.*)$/::error file=ears\/\1,line=\2,col=\3::\4/p' tsc.log | head -50
            exit 1
          }
      - run: npm test
      - run: npm run build

  web:
    name: web (customer website)
    needs: changes
    if: ${{ always() && needs.changes.outputs.done != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.web != 'false') }}
    runs-on: ubuntu-22.04  # 24.04 runners were queueing for hours (2026-10-05); see #29
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee install.log || {
            grep -E "npm (error|ERR)" install.log | head -40 | sed 's/^/::error title=npm ci::/'
            exit 1
          }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:links
      - run: npm run check:golive  # the *_LIVE switches and docs/GO_LIVE.md match (#1881)
      - run: npm run check:csp
      - run: npm run check:transitions  # page-change budget, less motion, plain legal pages (#1311)
      - run: npm run check:a11y  # real browser: contrast, focus ring, 320 px, reduced motion (#1224)
        timeout-minutes: 5
      - run: npm run check:weight  # page weight against a budget, and no picture over 150 KB (#1947)
      - run: npm run check:smoke  # real browser: the signed-in pages load and their main buttons work (#1488)
        timeout-minutes: 5

  # The core tests ran as one 15-minute job on a 4-core runner (#1984; `-n auto` finds the same 4
  # cores, so more workers would not help). They now run as four parts side by side (three finished in 8.2 minutes, the slowest part 6:40 of tests, so a fourth brings the whole job under 8), each on its
  # own runner and database, split by test file (core/tests/shard.py; a test in the wrong place
  # can't be skipped, the parts add up to the whole run, proven in tests/test_shard.py).
  # The job named "core (Python)" below is the one result to watch (and to require): it passes only
  # when every part did, so the name branch rules see has not changed.
  core-tests:
    name: core tests (part ${{ matrix.part }} of 4)
    needs: changes
    if: ${{ always() && needs.changes.outputs.done != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.core != 'false') }}
    runs-on: ubuntu-22.04  # 24.04 runners were queueing for hours (2026-10-05); see #29
    strategy:
      fail-fast: false  # a red part must not hide what the others found
      matrix:
        part: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: core
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # DMbot runs as an ordinary role so row-level security applies (superusers skip it).
      DMBOT_TEST_DATABASE_URL: postgresql://dmbot:dmbot@localhost:5432/dmbot_test
      DMBOT_TEST_SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/dmbot_test
      DMBOT_REQUIRE_DB_TESTS: "1"
      DMBOT_TEST_SHARD: ${{ matrix.part }}/4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - run: pip install -e ".[dev]"
      # Lint and types look at the code, not the tests' split, so one part does them.
      - if: ${{ matrix.part == 1 }}
        run: ruff check --output-format=github .
      - if: ${{ matrix.part == 1 }}
        run: ruff format --check .
      - name: mypy
        if: ${{ matrix.part == 1 }}
        run: |
          set -o pipefail
          mypy --no-pretty --no-error-summary 2>&1 | tee mypy.log || {
            sed -nE 's/^([^:]+):([0-9]+): error: (.*)$/::error file=core\/\1,line=\2::\3/p' mypy.log | head -50
            exit 1
          }
      - name: test database
        run: >-
          psql "postgresql://postgres:postgres@localhost:5432/postgres"
          -c "CREATE ROLE dmbot LOGIN PASSWORD 'dmbot'"
          -c "CREATE DATABASE dmbot_test OWNER dmbot ENCODING 'UTF8'"
      - name: faster test database
        # A throwaway database in a throwaway container: nothing here needs to survive a crash,
        # and every test builds and drops its own schema, so waiting for the disk is the cost.
        run: >-
          psql "postgresql://postgres:postgres@localhost:5432/postgres"
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"
      - name: pytest
        # -n 4: one worker per core of the 4-core runner (measured). Each database test builds its
        # own schema (core/tests/pg.py, random name) and migrations lock per schema, so workers
        # never share state.
        # --durations shows where the time goes. Nothing is skipped, deselected or xfailed.
        # Coverage (#1858) is printed (only the files with lines no test runs) and kept as
        # coverage.xml. It is a report, not a gate: no threshold until the baseline is known.
        run: |
          set -o pipefail
          pytest -q --tb=short -rfE -n 4 --durations=25 \
            --cov=dmbot --cov-report=term-missing:skip-covered --cov-report=xml 2>&1 | tee pytest.log || {
            # One multi-line annotation, so failures are readable without the raw log.
            summary=$(grep -E "^(FAILED|ERROR) |^E  |^[^ ].*\.py:[0-9]+: " pytest.log | head -80 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=pytest failures::${summary}"
            exit 1
          }
      - name: keep the coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage-part-${{ matrix.part }}
          path: core/coverage.xml
          if-no-files-found: ignore

  core:
    name: core (Python)
    needs: [changes, core-tests]
    # always(): a skipped part list (core untouched, or this commit already passed) is a pass, and
    # a failed or cancelled part must fail this job rather than skip it.
    if: ${{ always() && needs.changes.outputs.done != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.core != 'false') }}
    runs-on: ubuntu-22.04  # 24.04 runners were queueing for hours (2026-10-05); see #29
    timeout-minutes: 5
    steps:
      - run: |
          echo "core tests: ${{ needs.core-tests.result }}"
          test "${{ needs.core-tests.result }}" = "success"

  scripts:
    name: scripts (server helpers)
    needs: changes
    if: ${{ always() && needs.changes.outputs.done != 'true' }}
    runs-on: ubuntu-22.04  # 24.04 runners were queueing for hours (2026-10-05); see #29
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck scripts/set-key scripts/update-env scripts/set-admin-password scripts/replay scripts/set-variables scripts/ci-changes.sh scripts/ci-already-green.sh scripts/tests/*.sh   # on the runner
      - run: bash scripts/tests/test-set-key.sh
      - run: bash scripts/tests/test-update-env.sh
      - run: bash scripts/tests/test-set-admin-password.sh
      - run: bash scripts/tests/test-ci-changes.sh
      - run: bash scripts/tests/test-ci-already-green.sh

  docker:
    name: docker images
    needs: changes
    if: ${{ always() && needs.changes.outputs.done != 'true' }}
    runs-on: ubuntu-22.04  # 24.04 runners were queueing for hours (2026-10-05); see #29
    steps:
      - uses: actions/checkout@v5
      - name: compose file is valid
        run: |
          cp .env.example .env
          printf 'POSTGRES_ADMIN_PASSWORD=ci\nDMBOT_DB_PASSWORD=ci\n' >> .env
          docker compose config --quiet
      - name: build ears image
        run: docker build -t dmbot-ears ./ears
      - name: build core image (with local Whisper)
        run: docker build -t dmbot-core ./core
      - name: smoke test core image
        # Missing settings must fail fast with a readable message, not a traceback.
        run: |
          set +e
          out=$(docker run --rm dmbot-core 2>&1); code=$?
          echo "$out"
          test $code -eq 2 && echo "$out" | grep -q "Missing required settings"
      - name: smoke test web API (same image)
        run: |
          set +e
          out=$(docker run --rm dmbot-core python -m dmbot.web 2>&1); code=$?
          echo "$out"
          test $code -eq 2 && echo "$out" | grep -q "Missing required settings"
      - name: smoke test ears image
        run: |
          set +e
          out=$(docker run --rm dmbot-ears 2>&1); code=$?
          echo "$out"
          test $code -ne 0 && echo "$out" | grep -q "Missing required settings"
