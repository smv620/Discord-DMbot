name: CI

# Runs on every branch push (results show on the branch's pull request) so fixes can
# be verified before a PR is opened.
on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ears:
    name: ears (Node voice service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ears
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Switch to `npm ci` once package-lock.json is committed.
      - name: npm install
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee install.log || {
            grep -E "npm (error|ERR)" install.log | head -40 | sed 's/^/::error title=npm install::/'
            exit 1
          }
      - name: typecheck
        run: |
          set -o pipefail
          npx tsc -p tsconfig.json --pretty false 2>&1 | tee tsc.log || {
            sed -nE 's/^([^(]+)\(([0-9]+),([0-9]+)\): error (.*)$/::error file=ears\/\1,line=\2,col=\3::\4/p' tsc.log | head -50
            exit 1
          }
      - run: npm test
      - run: npm run build

  core:
    name: core (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - name: mypy
        run: |
          set -o pipefail
          mypy --no-pretty --no-error-summary 2>&1 | tee mypy.log || {
            sed -nE 's/^([^:]+):([0-9]+): error: (.*)$/::error file=core\/\1,line=\2::\3/p' mypy.log | head -50
            exit 1
          }
      - run: pytest -q
